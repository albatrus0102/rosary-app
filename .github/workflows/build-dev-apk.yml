name: Build DEV APK (개발용 임시 유리 포함)

# 수동 실행 전용. 개발용 임시 유리(스테인드글라스 시안, 실제 작품 아님)를 넣은 APK 를 만든다 — 배포 금지.
# docs/church/GLASS_DEV_PIPELINE.md §4
on:
  workflow_dispatch:

jobs:
  build-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: 개발용 APK 빌드 (arm64, ROSARIUM_DEV_GLASS)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CHURCH_SERVER_URL: ${{ secrets.CHURCH_SERVER_URL }}
        run: bash tools/build_dev_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rosarium-dev-apk
          path: build/dev-apk/rosarium-dev-*.apk
          if-no-files-found: error
