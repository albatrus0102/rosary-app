name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 한국어 음성 모델 다운로드 (캐시)
        id: model-cache
        uses: actions/cache@v4
        with:
          path: assets/models/sherpa-onnx-streaming-zipformer-korean-2024-06-16
          key: sherpa-korean-2024-06-16-v1

      - name: 모델 받기
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: bash scripts/fetch_model.sh

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: APK 빌드 (ABI별 분리)
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: rosary-app-apk
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
