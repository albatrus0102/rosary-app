    - assets/images/church_entry/thumb_milan.webp
    - assets/images/church_entry/thumb_myeongdong.webp
    - assets/images/church_entry/thumb_stpaul.webp
    - assets/images/church_entry/thumb_stpeter.webp
    # 앱 소개(첫 실행) 그림. 경로는 lib/ui/app_intro.dart 의 AppIntroArt.
