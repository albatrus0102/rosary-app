name: rosary_app
description: "묵주기도문을 보여 주고 버튼·탭·스와이프로 넘겨 주는 묵주기도 도우미 앱."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  record: ^7.1.2
  path_provider: ^2.1.6
  wakelock_plus: ^1.2.0
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
    - family: NotoSerifKR
      fonts:
        - asset: assets/fonts/NotoSerifKR-Regular.otf
          weight: 400
        - asset: assets/fonts/NotoSerifKR-Medium.otf
          weight: 500
  assets:
    - assets/images/
    - assets/sounds/
    - assets/fonts/OFL-Pretendard.txt
    - assets/fonts/OFL-NotoSerifKR.txt
