name: rosary_app
description: "로사리움 — 아바타로 성당을 걷고 함께 기도하는 가상 가톨릭 공간(묵주기도·스테인드글라스·십자가의 길)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  record: ^7.1.2
  path_provider: ^2.1.6
  wakelock_plus: ^1.2.0
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.2
  # 1.9.x: Flutter 3.47의 material.dart ColorScheme을 그대로 쓴다
  # (2.x는 material_ui 패키지의 별도 ColorScheme 타입을 사용한다).
  dynamic_color: ^1.9.0
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  supabase_flutter: ^2.18.3
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
  assets:
    # 검수용(출시) 빌드에서 뺀 자산(출처 미확인 묵주 그림 25장·AI 음성 62개·프레비아티·바티칸/이탈리아 공공 소장 배경 7점)은
    # 여기에 없다. 목록은 tools/release_hidden_assets.txt, 이유·풀리는 조건은 lib/app/release_gate.dart.
    # tools/build_dev_apk.sh 가 개발용 빌드 때만 그 목록을 임시로 더한다(개발용 유리 폴더와 같은 방식).
    # 성당 입구 화면 그림 슬롯(배경·레일 장식, 성당별 대표 그림·썸네일, 3D 렌더 샷).
    # 대체 규칙은 lib/church/church_entry_art.dart, 만드는 법은 docs/church/ENTRY_ART.md.
    # ※ 이 폴더와 아래 assets/church/·assets/church_thumbs/ 는 폴더째가 아니라 파일을 하나씩 적는다: 성당 측 요청으로 뺀 성당
    #   (ReleaseGate.withdrawnChurchIds)의 파일만 번들에서 빼기 위해서다(목록은 tools/release_hidden_assets.txt '2-2').
    #   새 파일을 이 폴더에 넣으면 여기에도 적어야 한다(test/release_gate_test.dart 가 빠짐을 잡는다).
    - assets/images/church_entry/bg_glow.webp
    - assets/images/church_entry/hero_milan.webp
    - assets/images/church_entry/rail_decor.webp
    - assets/images/church_entry/render_assisi.webp
    - assets/images/church_entry/render_basic.webp
    - assets/images/church_entry/render_danggogae.webp
    - assets/images/church_entry/render_florence.webp
    - assets/images/church_entry/render_lateran.webp
    - assets/images/church_entry/render_light.webp
    - assets/images/church_entry/render_myeongdong.webp
    - assets/images/church_entry/render_stpaul.webp
    - assets/images/church_entry/render_stpeter.webp
    - assets/images/church_entry/render_yeouido.webp
