name: rosary_app
description: "묵주기도문을 보여 주고 버튼·탭·스와이프로 넘겨 주는 묵주기도 도우미 앱."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  record: ^7.1.2
  path_provider: ^2.1.6
  wakelock_plus: ^1.2.0
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.2.5
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.2
  # 1.9.x: Flutter 3.47의 material.dart ColorScheme을 그대로 쓴다
  # (2.x는 material_ui 패키지의 별도 ColorScheme 타입을 사용한다).
  dynamic_color: ^1.9.0
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  supabase_flutter: ^2.18.3
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
  assets:
    - assets/images/
    # 성당 장면(JS·텍스처)과 스테인드글라스: glass_catalog.json, 성당 안에 걸 8점만 썸네일(_th)과
    # 1k 사진 팩(gpack_*_1k.js; 3D·평면 보기 공용). 나머지 38점·2k·1k WebP 원본은 번들 밖
    # (art/glass_unbundled/, art/glass_2k/, art/glass_1k/; tools/glass_bundle/glass_bundle.py).
    # 4096 마스터는 art/glass_masters/에 있고 번들하지 않는다(G2에서 CDN으로 내려받는다).
    - assets/church/
    - assets/church_thumbs/
    - assets/sounds/
    - assets/leader_voice/sister/
    - assets/leader_voice/priest/
    - assets/fonts/OFL-Pretendard.txt
