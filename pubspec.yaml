publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  sherpa_onnx: ^2.0.1
  record: ^7.1.2
  path_provider: ^2.1.6
  wakelock_plus: ^1.2.0
  shared_preferences: ^2.5.6
  audioplayers: ^6.8.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/sherpa-onnx-streaming-zipformer-korean-2024-06-16/
